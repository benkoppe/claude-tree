name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  bun:
    name: Bun (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun pm pack --dry-run
      - name: Test global installation
        shell: bash
        run: |
          archive="$(bun pm pack --destination "$RUNNER_TEMP" --quiet)"
          export BUN_INSTALL="$RUNNER_TEMP/bun-global"
          bun add --global "$RUNNER_TEMP/${archive##*/}"
          "$BUN_INSTALL/bin/claude-tree" --version
          "$BUN_INSTALL/bin/claude-tree" --help >/dev/null

  nix:
    name: Nix (${{ matrix.os }})
    permissions:
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v22
        with:
          extra-conf: |
            accept-flake-config = true
            sandbox = relaxed
      - name: Restore and save Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ matrix.os }}-${{ github.workflow }}-${{ hashFiles('flake.lock', '**/*.nix', 'bun.lock', 'package.json') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ matrix.os }}-${{ github.workflow }}-
          gc-max-store-size-linux: 4G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-${{ matrix.os }}-${{ github.workflow }}-
          purge-created: 0
          purge-primary-key: never
      - run: nix flake check --print-build-logs
      - run: nix run . -- --version
      - run: nix run . -- --help >/dev/null
