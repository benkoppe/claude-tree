name: Release
run-name: Release v${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.2.0 or 0.2.0-beta.1; no v prefix)"
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  BUILD_REVISION: ${{ github.sha }}
  BUILD_DIRTY: "false"

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate requested version
        id: version
        run: bun run scripts/prepare-release.ts
        env:
          RELEASE_VERSION: ${{ inputs.version }}
      - name: Package npm launcher
        run: |
          bun run package:npm
          bun run scripts/pack-release.ts npm
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-npm
          path: dist/artifacts/
          if-no-files-found: error
          compression-level: 0

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64-glibc
          - os: ubuntu-24.04-arm
            platform: linux-arm64-glibc
          - os: macos-15-intel
            platform: darwin-x64
          - os: macos-latest
            platform: darwin-arm64
          - os: ubuntu-latest
            platform: linux-x64-musl
            musl: true
          - os: ubuntu-24.04-arm
            platform: linux-arm64-musl
            musl: true
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Test and compile native platform
        if: ${{ !matrix.musl }}
        run: |
          bun install --frozen-lockfile
          bun run check
          bun run build:release
      - name: Test and compile musl platform
        if: ${{ matrix.musl }}
        run: |
          docker run --rm \
            -e RELEASE_VERSION -e BUILD_REVISION -e BUILD_DIRTY -e OPENTUI_LIBC=musl \
            -v "$PWD:/workspace" -w /workspace oven/bun:1.3.13-alpine \
            sh -euxc 'apk add --no-cache git tar libstdc++; git config --global --add safe.directory /workspace; bun install --frozen-lockfile; bun run check; bun run build:release'
          sudo chown -R "$(id -u):$(id -g)" dist
      - name: Pack npm package and standalone archive
        run: bun run scripts/pack-release.ts "$RELEASE_PLATFORM"
        env:
          RELEASE_PLATFORM: ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: dist/artifacts/
          if-no-files-found: error
          compression-level: 0

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      GH_TOKEN: ${{ github.token }}
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist/artifacts
          merge-multiple: true
      - name: Publish packages, tag, and GitHub Release
        run: |
          test -n "$NODE_AUTH_TOKEN" || { echo "Configure NPM_TOKEN in the release environment before publishing" >&2; exit 1; }
          bun run scripts/publish-release.ts
