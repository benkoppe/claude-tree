name: Release
run-name: Release v${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.2.0 or 0.2.0-beta.1; no v prefix)"
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  RELEASE_VERSION: ${{ inputs.version }}
  BUILD_REVISION: ${{ github.sha }}
  BUILD_DIRTY: "false"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64-glibc
          - os: ubuntu-24.04-arm
            platform: linux-arm64-glibc
          - os: macos-15-intel
            platform: darwin-x64
          - os: macos-latest
            platform: darwin-arm64
          - os: ubuntu-latest
            platform: linux-x64-musl
            musl: true
          - os: ubuntu-24.04-arm
            platform: linux-arm64-musl
            musl: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate version
        run: bun run build:release --validate
      - name: Test and package native platform
        if: ${{ !matrix.musl }}
        run: |
          bun install --frozen-lockfile
          bun run check
          bun run build:release
      - name: Test and package musl platform
        if: ${{ matrix.musl }}
        run: |
          docker run --rm \
            -e RELEASE_VERSION -e BUILD_REVISION -e BUILD_DIRTY -e OPENTUI_LIBC=musl \
            -v "$PWD:/workspace" -w /workspace oven/bun:1.3.13-alpine \
            sh -euxc 'apk add --no-cache git tar libstdc++ nodejs npm; git config --global --add safe.directory /workspace; bun install --frozen-lockfile; bun run check; bun run build:release'
          sudo chown -R "$(id -u):$(id -g)" dist
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: dist/packages/*.tgz
          if-no-files-found: error
          compression-level: 0

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist/packages
          merge-multiple: true
      - name: Publish platform packages, launcher, and tag
        shell: bash
        run: |
          bun run build:release --validate
          test -n "$NODE_AUTH_TOKEN" || { echo "Configure NPM_TOKEN in the release environment" >&2; exit 1; }
          existing_tag="$(git ls-remote --tags origin "refs/tags/v$RELEASE_VERSION")"
          test -z "$existing_tag" || { echo "Release tag already exists" >&2; exit 1; }
          bun run build:release --launcher
          channel=latest
          if [[ "$RELEASE_VERSION" == *-* ]]; then channel=next; fi
          shopt -s nullglob
          packages=(dist/packages/claude-tree-{darwin,linux}-*-"$RELEASE_VERSION".tgz)
          test "${#packages[@]}" -eq 6
          for package in "${packages[@]}"; do
            npm publish "$package" --access public --tag "$channel" --ignore-scripts
          done
          npm publish "dist/packages/claude-tree-$RELEASE_VERSION.tgz" --access public --tag "$channel" --ignore-scripts
          git tag "v$RELEASE_VERSION" "$BUILD_REVISION"
          git push origin "refs/tags/v$RELEASE_VERSION"
